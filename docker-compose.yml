services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/database.db}
      # Telegram Bot Tokens (needed for PayOS webhook fulfillment)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SUPPLIER_TELEGRAM_BOT_TOKEN: ${SUPPLIER_TELEGRAM_BOT_TOKEN}
      # PayOS Configuration (needed for webhook verification)
      PAYOS_BASE_URL: ${PAYOS_BASE_URL:-https://api-merchant.payos.vn}
      PAYOS_PARTNER_CODE: ${PAYOS_PARTNER_CODE:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    volumes:
      - database-data:/app/data
      - delivery-data:/app/delivery_data
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/database.db}
      # Payment provider selection
      PAYMENT_PROVIDER_DEFAULT: ${PAYMENT_PROVIDER_DEFAULT:-payos}
      # PayOS Configuration (needed for payment creation)
      PAYOS_BASE_URL: ${PAYOS_BASE_URL:-https://api-merchant.payos.vn}
      PAYOS_PARTNER_CODE: ${PAYOS_PARTNER_CODE:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-https://t.me/your_bot}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-https://t.me/your_bot}
      # Pay2S Configuration (needed for payment creation)
      PAY2S_ENDPOINT: ${PAY2S_ENDPOINT:-https://sandbox-payment.pay2s.vn/v1/gateway/api/create}
      PAY2S_PARTNER_CODE: ${PAY2S_PARTNER_CODE}
      PAY2S_ACCESS_KEY: ${PAY2S_ACCESS_KEY}
      PAY2S_SECRET_KEY: ${PAY2S_SECRET_KEY}
      DEFAULT_BANK_ACCOUNTS: ${DEFAULT_BANK_ACCOUNTS:-[{"account_number":"99999999","bank_id":"ACB"}]}
      # Payment URLs
      IPN_URL: ${IPN_URL}
      REDIRECT_URL: ${REDIRECT_URL:-https://t.me/your_bot}
    volumes:
      - database-data:/app/data
      - delivery-data:/app/delivery_data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot_supplier:
    build:
      context: .
      dockerfile: Dockerfile.bot-supplier
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/database.db}
      # Telegram configuration
      SUPPLIER_TELEGRAM_BOT_TOKEN: ${SUPPLIER_TELEGRAM_BOT_TOKEN}
    volumes:
      - database-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "8082:80"
    restart: unless-stopped
    depends_on:
      - api

  ipn-server:
    build:
      context: .
      dockerfile: Dockerfile.ipn
    container_name: pay2s-ipn-server
    env_file:
      - .env
    ports:
      - "${IPN_PORT:-5001}:5001"
    environment:
      # Database Configuration (same as other services)
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/database.db}
      # Telegram Bot Tokens (for sending messages after payment)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPPLIER_TELEGRAM_BOT_TOKEN=${SUPPLIER_TELEGRAM_BOT_TOKEN}
      # Pay2S Configuration
      - PAY2S_ENDPOINT=${PAY2S_ENDPOINT:-https://sandbox-payment.pay2s.vn/v1/gateway/api/create}
      - PAY2S_PARTNER_CODE=${PAY2S_PARTNER_CODE:-PAY2S7EPF0SB1ZP27W71}
      - PAY2S_ACCESS_KEY=${PAY2S_ACCESS_KEY:-REDACTED_PAY2S_ACCESS_KEY}
      - PAY2S_SECRET_KEY=${PAY2S_SECRET_KEY:-REDACTED_PAY2S_SECRET_KEY}
      # IPN Server Configuration
      - IPN_HOST=0.0.0.0
      - IPN_PORT=5001
    volumes:
      - database-data:/app/data
      - delivery-data:/app/delivery_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  pay2s-network:
    driver: bridge

volumes:
  database-data:
  delivery-data:

